[workspace]
resolver = "2"
members = ["crates/greehvac", "crates/greehvacd", "crates/greehvac-probe"]

[workspace.package]
edition = "2021"
license = "MIT"

# Tuned for the Pi Zero W: small binary, small resident set.
[profile.release]
opt-level = "z"     # optimize for size over speed
lto = true          # cross-crate inlining + dead-code elimination
codegen-units = 1   # maximize optimization, shrink output
strip = true        # drop symbols
panic = "abort"     # no unwinding tables; fine for a daemon
